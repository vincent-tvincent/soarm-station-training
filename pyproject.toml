[build-system]
requires = ["setuptools>=71"]
build-backend = "setuptools.build_meta"
[project]
name = "soarm-training"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = ["lerobot[training,smolvla,serial-motors,core_scripts]==0.7.0","PyYAML>=6,<7"]
[project.scripts]
soarm-training = "soarm_training.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
